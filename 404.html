<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eee5d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<title>Pullfolio — this page isn’t in the binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<!-- GitHub Pages shows this page for any address that isn't on the site, at
     any depth, so it carries its own styles and its own copy of the logo's
     pixel card. The script points the button at the site's front page. -->
<style>
  :root { color-scheme: light dark; --bg: #eee5d3; --dot: rgba(74, 52, 30, .14); --text: #1f1a16; --muted: #66584b; --edge: #1f1a16; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1714; --dot: rgba(255, 238, 215, .06); --text: #f3ebdf; --muted: #c3b29f; --edge: #000; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.1px, transparent 1.6px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  main { max-width: 520px; animation: rise .7s cubic-bezier(.22, 1, .36, 1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  svg { display: block; width: 96px; height: 96px; margin: 0 auto 26px; filter: drop-shadow(5px 5px 0 rgba(0, 0, 0, .28)); }
  h1 { margin: 0 0 14px; font-size: clamp(34px, 8vw, 54px); font-weight: 800; line-height: 1; letter-spacing: -.035em; text-wrap: balance; }
  mark { color: inherit; padding: 0 .04em; background: linear-gradient(transparent 60%, #ffd43b 60% 90%, transparent 90%); }
  @media (prefers-color-scheme: dark) { mark { background: linear-gradient(transparent 60%, #a8770f 60% 90%, transparent 90%); } }
  p { margin: 0 0 6px; color: var(--muted); font-size: 17px; line-height: 1.5; text-wrap: pretty; }
  a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 26px;
    padding: 13px 22px;
    border: 2px solid #1f1a16;
    border-radius: 999px;
    background: #ffd43b;
    color: #1f1a16;
    font-size: 16px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 4px 4px 0 var(--edge);
    transition: transform .12s cubic-bezier(.22, 1, .36, 1), box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) { a:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--edge); } }
  a:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--edge); }
  a:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } a { transition: none; } }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Pullfolio">
    <g fill="#1f1a16"><rect x="2" y="1" width="11" height="1"/><rect x="2" y="2" width="1" height="11"/><rect x="12" y="2" width="2" height="1"/><rect x="13" y="3" width="1" height="11"/><rect x="2" y="13" width="2" height="1"/><rect x="3" y="14" width="11" height="1"/></g>
    <g fill="#ffd43b"><rect x="3" y="2" width="9" height="1"/><rect x="3" y="3" width="1" height="7"/><rect x="11" y="3" width="1" height="7"/><rect x="3" y="10" width="9" height="1"/><rect x="3" y="11" width="1" height="1"/><rect x="9" y="11" width="3" height="1"/><rect x="3" y="12" width="9" height="1"/></g>
    <g fill="#c8302a"><rect x="4" y="3" width="7" height="1"/><rect x="12" y="3" width="1" height="10"/><rect x="4" y="4" width="3" height="1"/><rect x="8" y="4" width="3" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="9" y="5" width="2" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="4" y="7" width="2" height="1"/><rect x="9" y="7" width="2" height="1"/><rect x="4" y="8" width="3" height="1"/><rect x="8" y="8" width="3" height="1"/><rect x="4" y="9" width="7" height="1"/><rect x="4" y="13" width="9" height="1"/></g>
    <g fill="#fbf7ef"><rect x="7" y="4" width="1" height="1"/><rect x="6" y="5" width="3" height="1"/><rect x="5" y="6" width="5" height="1"/><rect x="6" y="7" width="3" height="1"/><rect x="7" y="8" width="1" height="1"/></g>
    <g fill="#e9a91c"><rect x="4" y="11" width="5" height="1"/></g>
  </svg>
  <h1>This page isn’t <mark>in the binder</mark>.</h1>
  <p lang="en">The address may have changed, or it was never filed.</p>
  <p lang="tr">Bu sayfa klasörde yok. Adres değişmiş olabilir.</p>
  <a id="home" href="/card-pages/">Open Pullfolio <span aria-hidden="true">→</span></a>
</main>
<script>
  // On github.io the site lives in the first folder of the address; on a
  // domain of its own it is the root.
  (function () {
    var first = location.pathname.split("/")[1] || "";
    var home = /\.github\.io$/.test(location.hostname) && first ? "/" + first + "/" : "/";
    document.getElementById("home").setAttribute("href", home);
  })();
</script>
</body>
</html>
