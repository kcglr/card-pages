# Keeps the site's app when the weekly "card bots" job publishes.
#
# That job (search/publish.sh run from /workspace/cardgrid, Mondays around
# 05:00 Istanbul time) publishes a fresh catalog in data/, but it also copies
# its own older index.html, app.js and the rest. After each of its pushes,
# this puts every file outside data/ back as it was before, so only the
# catalog data stays. Delete this file once the job publishes data/ only.

name: Keep the app after the card bots publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: card-bots-guard
  cancel-in-progress: false

jobs:
  restore:
    if: github.event.head_commit.author.email == 'bots@users.noreply.github.com' || github.event.head_commit.author.name == 'card bots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Put back everything outside data/
        id: restore
        run: |
          set -euo pipefail
          # The newest commit not made by the card bots.
          good=$(git log --format='%H %ae' | awk '$2 != "bots@users.noreply.github.com" { print $1; exit }')
          if [ -z "$good" ]; then
            echo "::error::No commit before the card bots in the last 30."
            exit 1
          fi
          echo "Putting back files from $(git log -1 --format='%h %s' "$good")"
          if git diff --quiet "$good" HEAD -- . ':(exclude)data'; then
            echo "The card bots changed only data/. Nothing to put back."
            exit 0
          fi
          git diff --stat "$good" HEAD -- . ':(exclude)data'
          git restore --source="$good" --staged --worktree -- . ':(exclude)data'
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Keep the app after the card bots' publish (their data/ stays)"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made by this workflow may not start a Pages build by itself.
      - name: Rebuild the site
        if: steps.restore.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::Could not ask for a Pages build."
